<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
  }
  .game-container {
    background: rgba(0,0,0,0.35);
    padding: 24px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
    max-width: 720px;
    width: 100%;
  }
  h1 { font-size: 28px; margin-bottom: 4px; letter-spacing: 2px; }
  .score-board { display: flex; justify-content: center; gap: 40px; margin: 12px 0 16px; font-size: 14px; color: #aee8ff; }
  .score-board span { color: #ffd54f; font-weight: bold; font-size: 20px; }
  canvas { background: #0a0f16; border-radius: 12px; border: 2px solid #2c5364; display: block; margin: 0 auto; }
  .controls { margin-top: 16px; font-size: 14px; color: #8ae; }
  .btn { margin-top: 12px; padding: 10px 24px; font-size: 16px; border: none; border-radius: 30px;
    background: linear-gradient(135deg, #ffd54f, #ff9f43); color: #173; font-weight: bold; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(255,213,79,0.3); }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .game-over { margin-top: 12px; font-size: 18px; color: #ff6b6b; min-height: 26px; font-weight: bold; }
  #homeBtn { background: linear-gradient(135deg, #74b9ff, #3b82f6); color: #fff; margin-left: 10px; }
  #leaderboard { margin: 16px auto 0; width: 100%; max-width: 360px; background: rgba(255,255,255,0.05);
    border-radius: 12px; border: 1px solid #2c5364; padding: 12px; text-align: left; }
  #leaderboard h2 { font-size: 15px; color: #aee8ff; margin-bottom: 8px; text-align: center; }
  #leaderboard ol { padding-left: 20px; font-size: 14px; }
  #leaderboard li { margin: 2px 0; }
  #leaderboard li::marker { color: #ffd54f; font-weight: bold; }
  #leaderboard .empty { color: #6a7; text-align: center; padding: 8px; font-size: 13px; }
  .rank { color: #ff3757; }
</style>
</head>
<body>
<div class="game-container">
  <h1>🐍 贪吃蛇</h1>
  <div class="score-board">
    <div>得分 <span id="score">0</span></div>
    <div>最高 <span id="highscore">0</span></div>
  </div>
  <canvas id="board"></canvas>
  <div class="controls">
    <p>方向键 / WASD 控制移动，空格或 P 暂停</p>
  </div>
  <div class="game-over" id="gameOver"></div>
  <div>
    <button class="btn" id="startBtn">开始游戏</button>
    <button class="btn" id="homeBtn">返回主页</button>
  </div>
  <div id="leaderboard"></div>
</div>

<script>
(() => {
  const SIZE = 20;
  const CELL = 24;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  canvas.width = SIZE * CELL;
  canvas.height = SIZE * CELL;

  const scoreEl = document.getElementById('score');
  const highscoreEl = document.getElementById('highscore');
  const gameOverEl = document.getElementById('gameOver');
  const startBtn = document.getElementById('startBtn');
  const homeBtn = document.getElementById('homeBtn');
  const boardEl = document.getElementById('leaderboard');

  let board, snake, dir, nextDir, food, score, high, state, timer;
  let token = null;          // server-issued game token
  let name = null;           // player name
  const SPEED = 130;

  high = Number(localStorage.getItem('snakeHighscore') || 0);
  highscoreEl.textContent = high;

  // ---- backend API helpers (with error handling) ----
  async function apiPost(path, payload) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  // Fetch the top-10 leaderboard and render it.
  async function refreshLeaderboard() {
    try {
      const res = await fetch('/api/snake/top?size=' + SIZE);
      if (!res.ok) return boardEl.innerHTML = '<div class="empty">暂无法加载排行榜</div>';
      const data = await res.json();
      const scores = data.scores || [];
      if (!scores.length) {
        boardEl.innerHTML = '<h2>🏆 排行榜（无记录）</h2><div class="empty">还没有人上榜，来拿第一！</div>';
        return;
      }
      const items = scores.slice(0, 10).map((s, i) =>
        `<li><span class="rank">${i + 1}.</span> ${escapeHtml(s.name)} — <b>${s.score}</b></li>`
      ).join('');
      boardEl.innerHTML = `<h2>🏆 排行榜 Top 10</h2><ol>${items}</ol>`;
    } catch (e) {
      boardEl.innerHTML = '<div class="empty">排行榜服务不可用</div>';
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function askName() {
    const saved = localStorage.getItem('snakeName');
    if (saved) { name = saved; return; }
    const input = prompt('输入你的昵称（最多16位，只能用字母/数字/下划线）：', '');
    if (input && /^[A-Za-z0-9_]{1,16}$/.test(input)) {
      name = input;
      localStorage.setItem('snakeName', input);
    } else {
      name = 'anonymous';
    }
  }

  // Start a new game: request a fresh token from the server first.
  async function start() {
    askName();
    try {
      const data = await apiPost('/api/snake/new', { size: SIZE });
      token = data.token;   // server authorized this game
    } catch (e) {
      token = null;         // offline: play anyway, score just won't be saved
      console.warn('token fetch failed, playing offline', e);
    }
    newGame();
    state = 'running';
    timer = setInterval(step, SPEED);
  }

  function newGame() {
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    snake = [{ x: 10, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { ...dir };
    score = 0;
    scoreEl.textContent = score;
    gameOverEl.textContent = '';
    spawnFood();
    draw();
    startBtn.textContent = '重新开始';
  }

  function spawnFood() {
    while (true) {
      const x = Math.floor(Math.random() * SIZE);
      const y = Math.floor(Math.random() * SIZE);
      if (!snake.some(s => s.x === x && s.y === y)) {
        food = { x, y };
        board[y][x] = 2;
        return;
      }
    }
  }

  function gameOver() {
    state = 'over';
    clearInterval(timer);
    if (score > high) {
      high = score;
      highscoreEl.textContent = high;
      localStorage.setItem('snakeHighscore', high);
      gameOverEl.textContent = `游戏结束！刷新最高分 ${score} 分 🎉`;
    } else {
      gameOverEl.textContent = `游戏结束！得分 ${score} 分`;
    }
    if (token) submitScore();
    else refreshLeaderboard(); // offline: still refresh what's cached server-side
  }

  // Submit the final score to the server leaderboard.
  async function submitScore() {
    try {
      await apiPost('/api/snake/score', { token, name, size: SIZE, score });
    } catch (e) {
      console.warn('score submit failed', e);
    }
    refreshLeaderboard();
  }

  function step() {
    if (state !== 'running') return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE) return gameOver();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      spawnFood();
    } else {
      const tail = snake.pop();
      board[tail.y][tail.x] = 0;
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#0a0f16';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let i = 1; i < SIZE; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }
    if (food) {
      ctx.fillStyle = '#ff4757';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
    }
    snake.forEach((seg, i) => {
      const x = seg.x * CELL, y = seg.y * CELL;
      const gradient = i === 0 ? '#4ade80' : `hsl(${120 + i * 3 % 40}, 80%, ${50 - (i % 5)}%)`;
      ctx.fillStyle = i === 0 ? '#4ade80' : gradient;
      ctx.fillRect(x + 1.5, y + 1.5, CELL - 3, CELL - 3);
      if (i === 0) {
        ctx.fillStyle = '#fff';
        if (dir.x === 1) { ctx.fillRect(x + 16, y + 6, 4, 4); ctx.fillRect(x + 16, y + 14, 4, 4); }
        else if (dir.x === -1) { ctx.fillRect(x + 4, y + 6, 4, 4); ctx.fillRect(x + 4, y + 14, 4, 4); }
        else if (dir.y === 1) { ctx.fillRect(x + 6, y + 16, 4, 4); ctx.fillRect(x + 14, y + 16, 4, 4); }
        else { ctx.fillRect(x + 6, y + 4, 4, 4); ctx.fillRect(x + 14, y + 4, 4, 4); }
      }
    });
  }

  function toggle() {
    if (state === 'running') { state = 'paused'; clearInterval(timer); startBtn.textContent = '继续'; }
    else if (state === 'paused') { state = 'running'; timer = setInterval(step, SPEED); startBtn.textContent = '重新开始'; }
  }

  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) e.preventDefault();
    if (key === ' ' || key === 'p') { toggle(); return; }
    let d = null;
    if (key === 'arrowup' || key === 'w') d = { x: 0, y: -1 };
    else if (key === 'arrowdown' || key === 's') d = { x: 0, y: 1 };
    else if (key === 'arrowleft' || key === 'a') d = { x: -1, y: 0 };
    else if (key === 'arrowright' || key === 'd') d = { x: 1, y: 0 };
    if (!d || state !== 'running') return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  });

  startBtn.addEventListener('click', () => {
    if (state === 'running' || state === 'paused') { gameOver(); }
    start();
  });

  homeBtn.addEventListener('click', () => { window.location.href = '/'; });

  // Initial idle board.
  newGame();
  state = 'idle';
  draw();
  startBtn.textContent = '开始游戏';
  refreshLeaderboard();
})();
</script>
</body>
</html>
